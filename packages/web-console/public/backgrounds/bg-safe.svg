<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="safeGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#02140e" />
