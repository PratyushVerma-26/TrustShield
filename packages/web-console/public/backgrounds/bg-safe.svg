  </defs>
  <rect width="1920" height="1080" fill="url(#safeGrad)" />

  <!-- Harmonious Geometric Sanctuary Grid -->
  <g stroke="#10b981" stroke-width="1" opacity="0.15">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Big Glowing Radiant Checkmark/Sanctuary Shield in Background -->
  <g transform="translate(1400, 540)" opacity="0.35">
    <circle cx="0" cy="0" r="260" fill="none" stroke="#34d399" stroke-width="3" />
    <circle cx="0" cy="0" r="210" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="10 10" />
    <path d="M -70 10 L -20 60 L 90 -50" fill="none" stroke="#6ee7b7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
