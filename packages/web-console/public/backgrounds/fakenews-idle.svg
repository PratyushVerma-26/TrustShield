<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="newsStudioBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#12243d" />
      <stop offset="60%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="hostSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="studioGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#newsStudioBg)" />

  <!-- Realistic Studio Desk Curved in Center -->
  <g stroke="#0284c7" stroke-width="3" opacity="0.4" fill="none">
    <ellipse cx="960" cy="850" rx="750" ry="200" />
    <line x1="210" y1="850" x2="1710" y2="850" />
  </g>

  <!-- News Anchor / Broadcast Host Figure Centered Left -->
  <g transform="translate(680, 480)">
    <!-- Anchor Torso & Sharp Professional Suit -->
    <path d="M -130 420 L -85 210 L 85 210 L 130 420 Z" fill="url(#hostSuit)" stroke="#475569" stroke-width="3" />
    <!-- White Dress Shirt & Red Tie -->
    <polygon points="-35,210 0,290 35,210" fill="#ffffff" />
    <polygon points="-12,235 0,360 12,235" fill="#ef4444" />
    <!-- Neck and Head -->
    <rect x="-22" y="165" width="44" height="48" fill="#fbcfe8" rx="6" />
    <ellipse cx="0" cy="120" rx="48" ry="62" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" />
    <!-- Hair & Headset -->
    <path d="M -50 100 C -50 45, 50 45, 50 100 C 50 90, 25 72, 0 72 C -25 72, -50 90, -50 100 Z" fill="#1e293b" />
    <!-- Mic Headset -->
    <path d="M -48 115 C -60 140, -40 160, -12 155" stroke="#38bdf8" stroke-width="3.5" fill="none" />
    <circle cx="-10" cy="155" r="5" fill="#38bdf8" />
    
    <!-- Anchor Nameplate -->
    <rect x="-95" y="425" width="190" height="38" rx="8" fill="#1e293b" stroke="#334e68" stroke-width="2" />
    <text x="0" y="450" font-family="sans-serif" font-size="16" fill="#94a3b8" font-weight="bold" text-anchor="middle">
      NEWS DESK ANCHOR
    </text>
  </g>

  <!-- Huge Broadcast Floating Screen Centered Right Beside the Host -->
  <g transform="translate(1220, 460)">
    <!-- High-Definition Bezel Screen (Enlarged) -->
    <rect x="-260" y="-200" width="520" height="380" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="4.5" filter="url(#studioGlow)" />
    <!-- Screen Inner Display -->
    <rect x="-240" y="-180" width="480" height="340" rx="14" fill="#090d16" />
    
    <!-- Breaking News Chyron Bar -->
    <rect x="-240" y="95" width="480" height="65" fill="#dc2626" />
    <text x="-215" y="136" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="900" letter-spacing="1">
      BREAKING VIRAL NEWS REPORT
    </text>

    <!-- BIG UNCERTAIN QUESTION MARK ON NEWS SCREEN (Whther News is Real or Fake) -->
    <circle cx="0" cy="-45" r="85" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="3.5" />
    <text x="0" y="-14" font-family="sans-serif" font-size="95" fill="#f59e0b" font-weight="900" text-anchor="middle">
      ?
    </text>

    <text x="0" y="65" font-family="sans-serif" font-size="16" fill="#fcd34d" font-weight="900" text-anchor="middle" letter-spacing="1">
      IS THIS CLAIM REAL OR FABRICATED?
    </text>
  </g>
</svg>
