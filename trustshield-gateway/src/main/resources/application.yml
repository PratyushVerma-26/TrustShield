server:
  port: 8080

spring:
  application:
    name: trustshield-gateway
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

trustshield:
  gateway:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://127.0.0.1:5173"
        - "http://127.0.0.1:3000"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    services:
      phishing-url: ${TRUSTSHIELD_PHISHING_URL:http://localhost:8083}
      breach-url: ${TRUSTSHIELD_BREACH_URL:http://localhost:8084}
      deepfake-url: ${TRUSTSHIELD_DEEPFAKE_URL:http://localhost:8085}
      fakenews-url: ${TRUSTSHIELD_FAKENEWS_URL:http://localhost:8086}
      integrity-url: ${TRUSTSHIELD_INTEGRITY_URL:http://localhost:8087}
      fusion-url: ${TRUSTSHIELD_FUSION_URL:http://localhost:8088}
      bot-url: ${TRUSTSHIELD_BOT_URL:http://localhost:8089}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
