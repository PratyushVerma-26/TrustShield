<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="newsStudioSafe" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#05402d" />
      <stop offset="60%" stop-color="#021c13" />
      <stop offset="100%" stop-color="#010c08" />
    </radialGradient>
    <filter id="safeGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#newsStudioSafe)" />

  <!-- Studio Anchor Figure Centered Left -->
  <g transform="translate(680, 480)">
    <path d="M -130 420 L -85 210 L 85 210 L 130 420 Z" fill="#1e293b" stroke="#34d399" stroke-width="3" />
    <polygon points="-35,210 0,290 35,210" fill="#ffffff" />
    <polygon points="-12,235 0,360 12,235" fill="#10b981" />
    <rect x="-22" y="165" width="44" height="48" fill="#fbcfe8" rx="6" />
    <ellipse cx="0" cy="120" rx="48" ry="62" fill="#fbcfe8" />
    <path d="M -50 100 C -50 45, 50 45, 50 100 Z" fill="#1e293b" />
    <!-- Thumbs up -->
    <circle cx="115" cy="280" r="24" fill="#34d399" />
    <text x="115" y="288" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
  </g>

  <!-- News Screen: QUESTION MARK TURNS INTO BIG VERIFIED AUTHENTIC TICK -->
  <g transform="translate(1220, 460)">
    <rect x="-260" y="-200" width="520" height="380" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="5" filter="url(#safeGlow)" />
    <rect x="-240" y="-180" width="480" height="340" rx="14" fill="#022c22" />
    
    <!-- Verified Green Chyron Bar -->
    <rect x="-240" y="95" width="480" height="65" fill="#059669" />
    <text x="-215" y="136" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="900" letter-spacing="1">
      OFFICIALLY CONFIRMED TRUE
    </text>

    <!-- BIG AUTHENTIC CHECKMARK -->
    <circle cx="0" cy="-45" r="85" fill="rgba(16, 185, 129, 0.25)" stroke="#34d399" stroke-width="4" />
    <path d="M -35 -45 L -10 -15 L 35 -65" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <text x="0" y="65" font-family="sans-serif" font-size="18" fill="#6ee7b7" font-weight="900" text-anchor="middle" letter-spacing="1">
      ✓ AUTHENTIC &amp; FACT-CHECKED TRUE
    </text>
  </g>
</svg>
