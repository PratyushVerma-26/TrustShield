<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="attackGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1920" height="1080" fill="url(#spaceGrad)" />

  <!-- Digital Grid Floor / Ambience -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200" />
    <line x1="0" y1="400" x2="1920" y2="400" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="800" x2="1920" y2="800" />
    <line x1="0" y1="1000" x2="1920" y2="1000" />
    <line x1="300" y1="0" x2="300" y2="1080" />
    <line x1="600" y1="0" x2="600" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1320" y1="0" x2="1320" y2="1080" />
    <line x1="1620" y1="0" x2="1620" y2="1080" />
  </g>

  <!-- Left Side: Attacks Matrix (Red/Crimson Vectors, Glitches, Warning Trajectories) -->
  <g id="attacks-left">
    <!-- Crimson Aura -->
    <circle cx="280" cy="540" r="320" fill="url(#attackGlow)" filter="url(#glow)" />
    <!-- Attack Missiles / Vector Streams -->
    <path d="M 100 280 Q 450 400 820 520" stroke="#f87171" stroke-width="3" fill="none" opacity="0.75" stroke-dasharray="12 8" />
    <path d="M 120 480 Q 520 510 810 540" stroke="#ef4444" stroke-width="4" fill="none" opacity="0.9" stroke-dasharray="16 6" />
    <path d="M 80 720 Q 480 620 830 560" stroke="#f43f5e" stroke-width="3.5" fill="none" opacity="0.8" stroke-dasharray="8 6" />
    <path d="M 220 880 Q 580 720 850 590" stroke="#dc2626" stroke-width="2.5" fill="none" opacity="0.7" stroke-dasharray="14 10" />

    <!-- Threat Nodes / Skulls / Malicious Markers -->
    <g transform="translate(180, 360)">
      <circle cx="0" cy="0" r="28" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
      <text x="0" y="7" font-family="sans-serif" font-size="20" fill="#fecaca" text-anchor="middle" font-weight="bold">⚡</text>
      <text x="0" y="45" font-family="monospace" font-size="12" fill="#fca5a5" text-anchor="middle">DDOS VECTOR</text>
    </g>

    <g transform="translate(240, 560)">
      <circle cx="0" cy="0" r="34" fill="#991b1b" stroke="#f87171" stroke-width="2.5" filter="url(#glow)" />
      <text x="0" y="8" font-family="sans-serif" font-size="24" fill="#fee2e2" text-anchor="middle" font-weight="bold">☠</text>
      <text x="0" y="52" font-family="monospace" font-size="13" fill="#fca5a5" text-anchor="middle" font-weight="bold">PHISHING LURE</text>
    </g>

    <g transform="translate(190, 760)">
      <circle cx="0" cy="0" r="28" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
      <text x="0" y="7" font-family="sans-serif" font-size="18" fill="#fecaca" text-anchor="middle" font-weight="bold">☣</text>
      <text x="0" y="45" font-family="monospace" font-size="12" fill="#fca5a5" text-anchor="middle">DATA BREACH</text>
    </g>
  </g>

  <!-- Center: Web-Connected Globe -->
  <g id="center-globe" transform="translate(960, 540)">
    <!-- Globe Outer Atmosphere Glow -->
    <circle cx="0" cy="0" r="240" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" filter="url(#glow)" />
    <circle cx="0" cy="0" r="220" fill="url(#globeGrad)" stroke="#0ea5e9" stroke-width="2" />

    <!-- Latitudes and Longitudes (Connected Globe Lines) -->
    <!-- Latitudes -->
    <ellipse cx="0" cy="0" rx="218" ry="80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="218" ry="160" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="218" ry="210" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
    <!-- Longitudes -->
    <ellipse cx="0" cy="0" rx="80" ry="218" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="160" ry="218" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <line x1="-218" y1="0" x2="218" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
    <line x1="0" y1="-218" x2="0" y2="218" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

    <!-- Connected Network Web Vertices / Data Nodes -->
    <g fill="#38bdf8" stroke="#ffffff" stroke-width="1.5">
      <circle cx="-120" cy="-60" r="5" />
      <circle cx="-50" cy="-140" r="6" />
      <circle cx="70" cy="-110" r="5" />
      <circle cx="140" cy="-30" r="6" />
      <circle cx="110" cy="80" r="5" />
      <circle cx="20" cy="130" r="6" />
      <circle cx="-80" cy="110" r="5" />
      <circle cx="-140" cy="40" r="6" />
      <circle cx="0" cy="0" r="8" fill="#10b981" stroke="#34d399" stroke-width="2" />
    </g>

    <!-- Synaptic Network Interconnect Lines -->
    <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
      <line x1="-120" y1="-60" x2="-50" y2="-140" />
      <line x1="-50" y1="-140" x2="70" y2="-110" />
      <line x1="70" y1="-110" x2="140" y2="-30" />
      <line x1="140" y1="-30" x2="110" y2="80" />
      <line x1="110" y1="80" x2="20" y2="130" />
      <line x1="20" y1="130" x2="-80" y2="110" />
      <line x1="-80" y1="110" x2="-140" y2="40" />
      <line x1="-140" y1="40" x2="-120" y2="-60" />
      <!-- Central Hub Spokes -->
      <line x1="0" y1="0" x2="-120" y2="-60" />
      <line x1="0" y1="0" x2="70" y2="-110" />
      <line x1="0" y1="0" x2="110" y2="80" />
      <line x1="0" y1="0" x2="-80" y2="110" />
    </g>

    <!-- Orbital Ring Satellite Path -->
    <ellipse cx="0" cy="0" rx="300" ry="110" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.5" transform="rotate(-25)" stroke-dasharray="10 14" />
  </g>

  <!-- Right Side: The Radiant Defense Shield (Cyan & Emerald Bastion) -->
  <g id="shield-right">
    <!-- Defensive Shield Aura -->
    <circle cx="1640" cy="540" r="320" fill="url(#shieldGlow)" filter="url(#glow)" />

    <!-- Impenetrable Fortress Shield Geometry -->
    <path d="M 1240 540 Q 1260 300 1420 220 L 1680 220 Q 1740 460 1620 780 Q 1500 890 1420 900 Q 1280 780 1240 540 Z"
          fill="url(#shieldGlow)" stroke="#38bdf8" stroke-width="5" filter="url(#glow)" opacity="0.85" />

    <!-- Inner Shield Luster -->
    <path d="M 1300 540 Q 1320 350 1440 280 L 1630 280 Q 1680 460 1580 730 Q 1480 820 1440 830 Q 1330 730 1300 540 Z"
          fill="none" stroke="#67e8f9" stroke-width="2.5" opacity="0.6" stroke-dasharray="20 10" />

    <!-- Shield Core Emblem -->
    <g transform="translate(1480, 540)">
      <circle cx="0" cy="0" r="50" fill="#0369a1" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
      <text x="0" y="14" font-family="sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="900">🛡</text>
    </g>

    <!-- Protective Sentinel Nodes -->
    <g transform="translate(1360, 360)">
      <circle cx="0" cy="0" r="26" fill="#065f46" stroke="#34d399" stroke-width="2.5" />
      <text x="0" y="7" font-family="sans-serif" font-size="18" fill="#d1fae5" text-anchor="middle" font-weight="bold">✓</text>
      <text x="0" y="44" font-family="monospace" font-size="12" fill="#6ee7b7" text-anchor="middle" font-weight="bold">CLEAN VERDICT</text>
    </g>

    <g transform="translate(1380, 720)">
      <circle cx="0" cy="0" r="26" fill="#0f766e" stroke="#2dd4bf" stroke-width="2.5" />
      <text x="0" y="7" font-family="sans-serif" font-size="18" fill="#ccfbf1" text-anchor="middle" font-weight="bold">🔒</text>
      <text x="0" y="44" font-family="monospace" font-size="12" fill="#5eead4" text-anchor="middle" font-weight="bold">ZERO LEAKAGE</text>
    </g>

    <!-- Deflected Laser Arcs colliding on the shield boundary -->
    <path d="M 850 540 Q 1100 535 1240 540" stroke="#f87171" stroke-width="5" fill="none" opacity="0.9" />
    <circle cx="1240" cy="540" r="22" fill="#ffffff" stroke="#ef4444" stroke-width="4" filter="url(#glow)" />
    <!-- Energy Sparks upon impact -->
    <line x1="1240" y1="540" x2="1200" y2="480" stroke="#fca5a5" stroke-width="3" />
    <line x1="1240" y1="540" x2="1210" y2="600" stroke="#fca5a5" stroke-width="3" />
    <line x1="1240" y1="540" x2="1280" y2="500" stroke="#38bdf8" stroke-width="3" />
    <line x1="1240" y1="540" x2="1270" y2="580" stroke="#38bdf8" stroke-width="3" />
  </g>
</svg>
