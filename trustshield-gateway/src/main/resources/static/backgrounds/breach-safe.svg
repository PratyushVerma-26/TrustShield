<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="breachSafeBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01140e" />
    </radialGradient>
    <filter id="safeMeshGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#breachSafeBg)" />

  <!-- The Sieve: Perfectly Catching & Blocking User Input in Center -->
  <g transform="translate(960, 520)">
    <!-- Reinforced Emerald Sieve Membrane Center -->
    <ellipse cx="0" cy="0" rx="600" ry="140" fill="rgba(6, 95, 70, 0.45)" stroke="#34d399" stroke-width="6" filter="url(#safeMeshGlow)" />
    <!-- Fine Grid -->
    <g stroke="#10b981" stroke-width="2" opacity="0.6">
      <line x1="-560" y1="0" x2="560" y2="0" />
      <line x1="-520" y1="-35" x2="520" y2="-35" />
      <line x1="-520" y1="35" x2="520" y2="35" />
      <line x1="-420" y1="-70" x2="420" y2="-70" />
      <line x1="-420" y1="70" x2="420" y2="70" />
      <line x1="-450" y1="-70" x2="-450" y2="70" />
      <line x1="-300" y1="-100" x2="-300" y2="100" />
      <line x1="-150" y1="-125" x2="-150" y2="125" />
      <line x1="0" y1="-140" x2="0" y2="140" />
      <line x1="150" y1="-125" x2="150" y2="125" />
      <line x1="300" y1="-100" x2="300" y2="100" />
      <line x1="450" y1="-70" x2="450" y2="70" />
    </g>

    <!-- User Input Held & Blocked Safely Above Sieve in Center -->
    <g transform="translate(0, -120)">
      <rect x="-240" y="-45" width="480" height="90" rx="45" fill="#047857" stroke="#6ee7b7" stroke-width="4.5" filter="url(#safeMeshGlow)" />
      <text x="0" y="10" font-family="monospace" font-size="22" fill="#ecfdf5" font-weight="900" text-anchor="middle">
        🛡️ CREDENTIAL BLOCKED SAFELY
      </text>
    </g>
    <text x="0" y="-200" font-family="sans-serif" font-size="20" fill="#a7f3d0" font-weight="bold" text-anchor="middle">
      Zero Penetration: Not Found in Any Public Hacker Breach Sieve
    </text>

    <!-- Bottom Chamber: Absolutely Clean (Nothing leaked through) -->
    <text x="0" y="180" font-family="sans-serif" font-size="22" fill="#34d399" font-weight="900" text-anchor="middle">
      ✓ ZERO LEAKAGE: ALL CLEAR BELOW THE SIEVE
    </text>
  </g>
</svg>
