<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="oceanBg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#102844" />
      <stop offset="50%" stop-color="#091424" />
      <stop offset="100%" stop-color="#020710" />
    </radialGradient>
    <linearGradient id="fishLineGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#oceanBg)" />

  <!-- Enlarged Centered Water Ripples -->
  <g stroke="#0284c7" stroke-width="2" opacity="0.2" fill="none">
    <ellipse cx="960" cy="540" rx="700" ry="140" />
    <ellipse cx="960" cy="540" rx="520" ry="100" />
    <ellipse cx="960" cy="540" rx="340" ry="65" />
  </g>

  <!-- Centered & Enlarged Dark Lurking Hacker Silhouette above the Surface -->
  <g transform="translate(960, 40)" opacity="0.45">
    <!-- Huge Fishing Rod casting forward -->
    <path d="M -160 100 L 40 -10 L 220 -40" stroke="#64748b" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Cloaked Angler -->
    <path d="M -220 220 C -220 120, -170 80, -100 80 C -30 80, 20 120, 20 220 Z" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
    <circle cx="-100" cy="50" r="34" fill="#0f172a" />
  </g>

  <!-- Glowing Neon Fishing Line Dropping Down Center -->
  <path d="M 1180 0 Q 1020 240 960 440" stroke="url(#fishLineGlow)" stroke-width="4.5" fill="none" filter="url(#glow)" />
  
  <!-- Enlarged Metallic Fish Hook in the Center -->
  <g transform="translate(960, 440)">
    <path d="M 0 0 V 60 C 0 105, 60 105, 60 60 C 60 38, 45 30, 36 45" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
    <polygon points="36,45 32,28 50,34" fill="#cbd5e1" />
  </g>

  <!-- The Bait: Enlarged Questionable Phishing URL Tag Dangling in the Center -->
  <g transform="translate(960, 560)">
    <!-- Bait Glow -->
    <rect x="-260" y="-45" width="520" height="90" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3.5" filter="url(#glow)" />
    <!-- URL Text & Bait Indicator -->
    <text x="-220" y="8" font-family="JetBrains Mono, monospace" font-size="22" fill="#fef08a" font-weight="900">
      🎣 https://sbi-login.verify.xyz
    </text>
    <text x="0" y="72" font-family="sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="900" letter-spacing="2">
      SUSPICIOUS LURE HOOKED (DECEPTIVE DOMAIN)
    </text>
  </g>

  <!-- Enlarged User Hand Reaching up from Below Center to Grab It -->
  <g transform="translate(960, 780)" opacity="0.75">
    <!-- Arm -->
    <path d="M -180 280 Q -60 140 0 50" stroke="#cbd5e1" stroke-width="42" stroke-linecap="round" fill="none" />
    <!-- Hand Palm & Reaching Fingers toward Hook -->
    <g transform="translate(0, 40)">
      <ellipse cx="20" cy="10" rx="42" ry="28" fill="#94a3b8" />
      <!-- Grasping Fingers -->
      <path d="M 35 -10 C 65 -50, 85 -90, 95 -120" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 45 0 C 80 -30, 110 -65, 125 -95" stroke="#cbd5e1" stroke-width="11" stroke-linecap="round" fill="none" />
      <path d="M 40 15 C 75 -5, 105 -35, 120 -65" stroke="#cbd5e1" stroke-width="11" stroke-linecap="round" fill="none" />
      <path d="M 30 30 C 60 25, 85 10, 105 -15" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" fill="none" />
      <!-- Thumb -->
      <path d="M 15 -25 C 20 -60, 45 -85, 65 -105" stroke="#cbd5e1" stroke-width="11" stroke-linecap="round" fill="none" />
    </g>
    <!-- Warning Ripple -->
    <circle cx="100" cy="-60" r="50" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" />
    <text x="100" y="-130" font-family="sans-serif" font-size="16" fill="#fca5a5" font-weight="900" text-anchor="middle" letter-spacing="1">
      ⚠️ CAUTION: USER ABOUT TO CLICK SUSPICIOUS LURE
    </text>
  </g>
</svg>
