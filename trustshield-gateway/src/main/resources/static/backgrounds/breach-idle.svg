<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="breachSieveBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#241b08" />
      <stop offset="60%" stop-color="#0e0a04" />
      <stop offset="100%" stop-color="#040301" />
    </radialGradient>
    <linearGradient id="meshGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3" />
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#breachSieveBg)" />

  <!-- Enlarged Sieve / Filter Mesh Membrane in Dead Center -->
  <g transform="translate(960, 520)">
    <!-- The Sieve Mesh Funnel Boundary (Huge Ellipse in the Center) -->
    <ellipse cx="0" cy="0" rx="600" ry="140" fill="none" stroke="url(#meshGlow)" stroke-width="6" filter="url(#goldGlow)" />
    <!-- Perforated Sieve Wire Grid Across Full Center -->
    <g stroke="#f59e0b" stroke-width="1.8" opacity="0.45">
      <line x1="-560" y1="0" x2="560" y2="0" />
      <line x1="-520" y1="-35" x2="520" y2="-35" />
      <line x1="-520" y1="35" x2="520" y2="35" />
      <line x1="-420" y1="-70" x2="420" y2="-70" />
      <line x1="-420" y1="70" x2="420" y2="70" />
      
      <!-- Vertical ribs -->
      <line x1="-450" y1="-70" x2="-450" y2="70" />
      <line x1="-300" y1="-100" x2="-300" y2="100" />
      <line x1="-150" y1="-125" x2="-150" y2="125" />
      <line x1="0" y1="-140" x2="0" y2="140" />
      <line x1="150" y1="-125" x2="150" y2="125" />
      <line x1="300" y1="-100" x2="300" y2="100" />
      <line x1="450" y1="-70" x2="450" y2="70" />
    </g>
    <text x="0" y="180" font-family="sans-serif" font-size="18" fill="#fbbf24" font-weight="900" text-anchor="middle" letter-spacing="2">
      BREACH FILTER SIEVE MEMBRANE
    </text>

    <!-- Top Chamber: SECURED ENCRYPTED DATA (Blocked from leaking above the sieve) -->
    <g transform="translate(0, -220)">
      <g transform="translate(-240, 0)">
        <rect x="-80" y="-28" width="160" height="56" rx="28" fill="#065f46" stroke="#34d399" stroke-width="3" />
        <text x="0" y="8" font-family="monospace" font-size="16" fill="#d1fae5" font-weight="bold" text-anchor="middle">🔒 SECURED</text>
      </g>
      <g transform="translate(0, -40)">
        <rect x="-110" y="-32" width="220" height="64" rx="32" fill="#065f46" stroke="#34d399" stroke-width="3.5" filter="url(#goldGlow)" />
        <text x="0" y="9" font-family="monospace" font-size="17" fill="#d1fae5" font-weight="bold" text-anchor="middle">🔒 SHA-256 (SALTED)</text>
      </g>
      <g transform="translate(240, 0)">
        <rect x="-80" y="-28" width="160" height="56" rx="28" fill="#065f46" stroke="#34d399" stroke-width="3" />
        <text x="0" y="8" font-family="monospace" font-size="16" fill="#d1fae5" font-weight="bold" text-anchor="middle">🔒 ENCRYPTED</text>
      </g>
      <text x="0" y="-100" font-family="sans-serif" font-size="16" fill="#34d399" font-weight="bold" text-anchor="middle">
        ▲ Strong &amp; Zero-Knowledge Hashes: Safely Retained Above Sieve
      </text>
    </g>

    <!-- Bottom Chamber: UNSECURED LEAKED DATA PASSING THROUGH THE SIEVE -->
    <g transform="translate(0, 240)">
      <g transform="translate(-220, 20)">
        <rect x="-90" y="-25" width="180" height="50" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="3" />
        <text x="0" y="7" font-family="monospace" font-size="15" fill="#fee2e2" font-weight="bold" text-anchor="middle">⚠️ password123</text>
        <line x1="0" y1="-60" x2="0" y2="-25" stroke="#f87171" stroke-width="3" stroke-dasharray="6 6" />
      </g>
      <g transform="translate(220, 40)">
        <rect x="-100" y="-25" width="200" height="50" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="3" />
        <text x="0" y="7" font-family="monospace" font-size="15" fill="#fee2e2" font-weight="bold" text-anchor="middle">⚠️ leaked_user@mail</text>
        <line x1="0" y1="-80" x2="0" y2="-25" stroke="#f87171" stroke-width="3" stroke-dasharray="6 6" />
      </g>
      <text x="0" y="110" font-family="sans-serif" font-size="16" fill="#f87171" font-weight="bold" text-anchor="middle">
        ▼ Unhashed Credentials: Sifting Straight Through &amp; Exposed
      </text>
    </g>
  </g>
</svg>
