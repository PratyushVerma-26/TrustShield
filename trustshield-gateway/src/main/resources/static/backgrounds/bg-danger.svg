<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="dangerGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#1f0404" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090101" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#dangerGrad)" />

  <!-- Threat Warning Trajectories & Hazard Stripes -->
  <g stroke="#ef4444" stroke-width="1.5" opacity="0.25">
    <line x1="0" y1="0" x2="1920" y2="1080" stroke-dasharray="16 12" />
    <line x1="0" y1="1080" x2="1920" y2="0" stroke-dasharray="16 12" />
  </g>

  <!-- Big Glowing Warning Silhouette in Background -->
  <g transform="translate(1450, 540)" opacity="0.3">
    <polygon points="0,-160 170,140 -170,140" fill="none" stroke="#f87171" stroke-width="6" stroke-linejoin="round" />
    <line x1="0" y1="-70" x2="0" y2="30" stroke="#f87171" stroke-width="14" stroke-linecap="round" />
    <circle cx="0" cy="85" r="9" fill="#f87171" />
  </g>
</svg>
