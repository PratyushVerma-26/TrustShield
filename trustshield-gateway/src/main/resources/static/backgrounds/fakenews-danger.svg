<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="newsStudioDanger" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#550808" />
      <stop offset="60%" stop-color="#240202" />
      <stop offset="100%" stop-color="#0c0000" />
    </radialGradient>
    <filter id="dangerGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#newsStudioDanger)" />

  <!-- Studio Anchor Figure Centered Left -->
  <g transform="translate(680, 480)">
    <path d="M -130 420 L -85 210 L 85 210 L 130 420 Z" fill="#1e1010" stroke="#ef4444" stroke-width="3" />
    <polygon points="-35,210 0,290 35,210" fill="#ffffff" />
    <polygon points="-12,235 0,360 12,235" fill="#dc2626" />
    <rect x="-22" y="165" width="44" height="48" fill="#fbcfe8" rx="6" />
    <ellipse cx="0" cy="120" rx="48" ry="62" fill="#fbcfe8" />
    <path d="M -50 100 C -50 45, 50 45, 50 100 Z" fill="#1e293b" />
    <!-- Alert Hand Stop Signal -->
    <circle cx="115" cy="270" r="26" fill="#ef4444" />
    <text x="115" y="278" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">✋</text>
  </g>

  <!-- News Screen: QUESTION MARK TURNS INTO BIG DEBUNKED FAKE STAMP -->
  <g transform="translate(1220, 460)">
    <rect x="-260" y="-200" width="520" height="380" rx="22" fill="#450a0a" stroke="#ef4444" stroke-width="5" filter="url(#dangerGlow)" />
    <rect x="-240" y="-180" width="480" height="340" rx="14" fill="#1f0404" />
    
    <!-- Red Alert Chyron Bar -->
    <rect x="-240" y="95" width="480" height="65" fill="#991b1b" />
    <text x="-215" y="136" font-family="sans-serif" font-size="18" fill="#fee2e2" font-weight="900" letter-spacing="1">
      DEBUNKED HOAX / VIRAL FABRICATION
    </text>

    <!-- BIG RED FAKE MARK 'X' -->
    <circle cx="0" cy="-45" r="85" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="4" />
    <path d="M -32 -77 L 32 -13 M 32 -77 L -32 -13" stroke="#ef4444" stroke-width="16" stroke-linecap="round" />

    <text x="0" y="65" font-family="sans-serif" font-size="18" fill="#fca5a5" font-weight="900" text-anchor="middle" letter-spacing="1">
      ✗ 100% DEBUNKED FAKE NEWS
    </text>
  </g>
</svg>
