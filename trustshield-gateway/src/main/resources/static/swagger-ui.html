<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrustShield Unified Cyber-Defense API | Swagger UI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230ea5e9'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z'/></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar { display: none !important; }
    .custom-header {
      background: #0F172A;
      border-bottom: 1px solid #1E293B;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: #38BDF8;
    }
    .nav-links {
      display: flex;
      gap: 1.25rem;
      font-size: 0.85rem;
    }
    .nav-links a {
      color: #94A3B8;
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover {
      color: #38BDF8;
    }
    #swagger-container {
      background: #FFFFFF;
      max-width: 1240px;
      margin: 1.5rem auto;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <header class="custom-header">
    <div class="brand-title">
      <span>🛡️</span>
      <span>TrustShield Unified Cyber-Defense API</span>
    </div>
    <nav class="nav-links">
      <a href="/">Console</a>
      <a href="/chat.html">Cyber-Bot</a>
      <a href="/docs/openapi.yaml" download="trustshield-openapi.yaml">Download OpenAPI YAML</a>
      <a href="/actuator/health">Mesh Health</a>
    </nav>
  </header>
  <div id="swagger-container">
    <div id="swagger-ui"></div>
  </div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/docs/openapi.yaml",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
